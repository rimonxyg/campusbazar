<!DOCTYPE html>
<html>
<head>
    <title>CampusBazar - Unified Login</title>
</head>
<body>
    <form action="" method="post">
        <center>
            <h2>CampusBazar</h2>
            <h3>Unified Portal for Students, Teachers &amp; Alumni</h3>
        </center>

        <br>

        <fieldset>
            <legend>CampusBazar Login</legend>
            <table>
                <tr>
                    <td><label>Select Role:</label></td>
                    <td>
                        <input type="radio" name="role" id="role_student" value="student" checked><label for="role_student">Student</label>
                        <input type="radio" name="role" id="role_teacher" value="teacher"><label for="role_teacher">Teacher</label>
                        <input type="radio" name="role" id="role_alumni" value="alumni"><label for="role_alumni">Alumni</label>
                        <input type="radio" name="role" id="role_admin" value="admin"><label for="role_admin">Admin</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="login_id">Email or User ID:</label></td>
                    <td><input type="text" name="login_id" id="login_id" placeholder="e.g. 21-xxxxx-1 or user@aiub.edu" required></td>
                </tr>
                <tr>
                    <td><label for="login_password">Password:</label></td>
                    <td><input type="password" name="login_password" id="login_password" placeholder="Password" required></td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="checkbox" name="remember" id="remember">
                        <label for="remember">Remember me</label>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Sign In">
                        <input type="reset" value="Clear">
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>New User? Register Below</legend>
            <p>Select your account type to register:</p>
            <ul>
                <li><a href="alumni_registration.html">Register as Alumni</a></li>
                <li><a href="#">Register as Student</a></li>
                <li><a href="#">Register as Teacher</a></li>
                <li><a href="#">Register as Admin</a></li>
            </ul>
        </fieldset>
    </form>
</body>
</html>
