<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Page</title>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form action="#" method="POST">
        
        <label for="name">Student's Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="father_name">Father's Name:</label><br>
        <input type="text" id="father_name" name="father_name" required><br><br>

        <label for="mother_name">Mother's Name:</label><br>
        <input type="text" id="mother_name" name="mother_name" required><br><br>

        <label for="location">Location / Address:</label><br>
        <textarea id="location" name="location" rows="3" required></textarea><br><br>

        <label for="telephone">Telephone Number:</label><br>
        <input type="tel" id="telephone" name="telephone"><br><br>

        <label for="phone">Phone Number (Mobile):</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="email">Email ID:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="blood_group">Blood Group:</label><br>
        <select id="blood_group" name="blood_group" required>
            <option value="">--Select Blood Group--</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select><br><br>

        <label for="subject">Select Subject / Program:</label><br>
        <select id="subject" name="subject" required>
            <option value="">--Select Subject--</option>
            <option value="eee">EEE</option>
            <option value="cse">CSE</option>
            <option value="bba">BBA</option>
            <option value="cyber_security">Cyber Security</option>
        </select><br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
